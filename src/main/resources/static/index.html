<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Event Hub - Payment</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f5f5f5;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }

        .payment-container {
            background: white;
            padding: 30px;
            border-radius: 12px;
            width: 400px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.15);
        }

        h2 {
            text-align: center;
            margin-bottom: 25px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
        }

        input {
            width: 100%;
            box-sizing: border-box;
            padding: 12px;
            margin-bottom: 20px;
            border: 1px solid #ccc;
            border-radius: 6px;
        }

        button {
            width: 100%;
            padding: 13px;
            border: none;
            border-radius: 6px;
            background: #3399cc;
            color: white;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background: #287da5;
        }

        #message {
            margin-top: 20px;
            text-align: center;
            font-weight: bold;
        }
    </style>

    <!-- Razorpay Checkout -->
    <script src="https://checkout.razorpay.com/v1/checkout.js"></script>
</head>

<body>

<div class="payment-container">

    <h2>Event Hub Payment</h2>

    <label for="bookingId">Booking ID</label>

    <input
            type="number"
            id="bookingId"
            placeholder="Enter Booking ID"
            required
    >

    <button onclick="payNow()">
        Pay Now
    </button>

    <div id="message"></div>

</div>


<script>

    async function payNow() {

        const bookingId = document.getElementById("bookingId").value;
        const message = document.getElementById("message");

        if (!bookingId) {
            message.innerText = "Please enter Booking ID";
            return;
        }

        /*
         * Get JWT token from browser storage.
         */
        const token = localStorage.getItem("token");

        if (!token) {
            message.innerText = "Please login first.";
            console.error("JWT token not found in localStorage.");
            return;
        }

        try {

            message.innerText = "Creating payment order...";

            /*
             * Call Spring Boot backend.
             *
             * IMPORTANT:
             * JWT is sent here.
             */
            const response = await fetch(
                "/api/user/payment/createorder",
                {
                    method: "POST",

                    headers: {
                        "Content-Type": "application/json",

                        "Authorization": "Bearer " + token
                    },

                    body: JSON.stringify({
                        bookingId: Number(bookingId)
                    })
                }
            );

            /*
             * If Spring Security returns 401 / 403
             */
            if (response.status === 401) {
                throw new Error(
                    "Unauthorized. Your login token is invalid or expired."
                );
            }

            if (response.status === 403) {
                throw new Error(
                    "403 Forbidden. Spring Security rejected this request."
                );
            }

            if (!response.ok) {

                const errorText = await response.text();

                console.error("Backend error:", errorText);

                throw new Error(
                    "Unable to create payment order"
                );
            }

            /*
             * Read Razorpay order response.
             */
            const paymentData = await response.json();

            console.log("Payment Order Response:", paymentData);

            /*
             * Open Razorpay Checkout.
             *
             * Adjust these property names only if your
             * PaymentResponseDto uses different names.
             */
            const options = {

                key: paymentData.key,

                amount: paymentData.amount,

                currency: paymentData.currency || "INR",

                name: "Event Hub",

                description: "Event Ticket Booking",

                order_id: paymentData.orderId,

                handler: async function (response) {

                    console.log(
                        "Razorpay Payment Response:",
                        response
                    );

                    message.innerText =
                        "Payment successful. Verifying payment...";

                    await verifyPayment(response);
                },

                modal: {
                    ondismiss: function () {
                        message.innerText =
                            "Payment cancelled.";
                    }
                },

                theme: {
                    color: "#3399cc"
                }
            };

            const razorpay = new Razorpay(options);

            razorpay.on("payment.failed", function (response) {

                console.error(
                    "Razorpay payment failed:",
                    response.error
                );

                message.innerText =
                    "Payment failed: " +
                    response.error.description;
            });

            razorpay.open();

        } catch (error) {

            console.error(error);

            message.innerText = error.message;
        }
    }


    /*
     * Verify Razorpay payment with Spring Boot.
     */
    async function verifyPayment(paymentResponse) {

        const token = localStorage.getItem("token");

        try {

            const response = await fetch(
                "/api/user/payment/verifypayment",
                {
                    method: "POST",

                    headers: {
                        "Content-Type": "application/json",

                        "Authorization": "Bearer " + token
                    },

                    body: JSON.stringify({

                        razorpayOrderId:
                            paymentResponse.razorpay_order_id,

                        razorpayPaymentId:
                            paymentResponse.razorpay_payment_id,

                        razorpaySignature:
                            paymentResponse.razorpay_signature
                    })
                }
            );

            if (response.status === 401) {
                throw new Error(
                    "Unauthorized while verifying payment."
                );
            }

            if (response.status === 403) {
                throw new Error(
                    "403 Forbidden while verifying payment."
                );
            }

            if (!response.ok) {

                const errorText = await response.text();

                console.error(
                    "Payment verification error:",
                    errorText
                );

                throw new Error(
                    "Payment verification failed."
                );
            }

            const result = await response.json();

            console.log(
                "Payment verification response:",
                result
            );

            document.getElementById("message").innerText =
                "Payment successful! Ticket will be generated.";

        } catch (error) {

            console.error(error);

            document.getElementById("message").innerText =
                error.message;
        }
    }

</script>

</body>
</html>
